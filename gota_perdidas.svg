<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 424" width="556" height="424" role="img" aria-label="Gota con fuga de agua">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8fd"/>
      <stop offset="1" stop-color="#bfe6f7"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6f7"/>
      <stop offset="1" stop-color="#1380b8"/>
    </linearGradient>
  </defs>

  <rect width="556" height="424" rx="24" fill="url(#bg)"/>
  <circle cx="278" cy="200" r="165" fill="#ffffff" opacity="0.45"/>

  <!-- gota con grieta -->
  <path d="M278 30 C 236 103, 176 165, 176 235 A 102 102 0 0 0 380 235 C 380 165, 320 103, 278 30 Z" fill="url(#drop)" stroke="#ffffff" stroke-width="7"/>
  <ellipse cx="226" cy="228" rx="12" ry="36" fill="#ffffff" opacity="0.35" transform="rotate(12 226 228)"/>
  <polyline points="278,150 258,192 294,220 262,262 290,300" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="278,150 258,192 294,220 262,262 290,300" fill="none" stroke="#0b4f6c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>

  <!-- gotas que se escapan -->
  <g fill="#2aa8d6">
    <path d="M290 322 q 9 14 0 22 q -9 -8 0 -22z"/>
    <path d="M262 346 q 8 12 0 19 q -8 -7 0 -19z"/>
    <path d="M312 352 q 7 11 0 17 q -7 -6 0 -17z"/>
  </g>

  <!-- charco -->
  <ellipse cx="285" cy="392" rx="125" ry="14" fill="#5fb8dd" opacity="0.65"/>
  <ellipse cx="285" cy="392" rx="80" ry="8" fill="#9fe3f5" opacity="0.7"/>

  <!-- flecha de pérdida -->
  <g transform="translate(86,170)">
    <rect x="-18" y="-60" width="36" height="80" rx="6" fill="#e02424"/>
    <polygon points="-44,18 44,18 0,76" fill="#e02424"/>
  </g>

  <!-- alerta -->
  <circle cx="460" cy="92" r="36" fill="#e02424" stroke="#ffffff" stroke-width="5"/>
  <text x="460" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#ffffff">!</text>
</svg>
