<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="ODS 6 Agua limpia y saneamiento">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9f7"/>
      <stop offset="1" stop-color="#eaf8fc"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6f7"/>
      <stop offset="1" stop-color="#1380b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="tree">
      <rect x="-5" y="0" width="10" height="38" rx="3" fill="#6b4a2f"/>
      <circle cx="0" cy="-12" r="28" fill="#2e9b5a"/>
      <circle cx="-17" cy="4" r="18" fill="#3aae68"/>
      <circle cx="17" cy="4" r="18" fill="#278a4e"/>
    </g>
    <g id="person">
      <circle cx="0" cy="0" r="9" fill="#8a5a3c"/>
      <rect x="-10" y="10" width="20" height="30" rx="8" fill="currentColor"/>
      <rect x="-9" y="38" width="7" height="22" rx="3" fill="#3b4a6b"/>
      <rect x="2" y="38" width="7" height="22" rx="3" fill="#3b4a6b"/>
    </g>
  </defs>

  <!-- cielo -->
  <rect width="1200" height="670" fill="url(#sky)"/>
  <circle cx="600" cy="250" r="330" fill="url(#glow)"/>

  <!-- rayos -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round">
    <line x1="600" y1="250" x2="600" y2="10"/>
    <line x1="600" y1="250" x2="430" y2="40"/>
    <line x1="600" y1="250" x2="770" y2="40"/>
    <line x1="600" y1="250" x2="300" y2="110"/>
    <line x1="600" y1="250" x2="900" y2="110"/>
  </g>

  <!-- nubes -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="190" cy="90" rx="70" ry="22"/><ellipse cx="230" cy="75" rx="50" ry="24"/>
    <ellipse cx="1000" cy="110" rx="80" ry="24"/><ellipse cx="1050" cy="92" rx="55" ry="26"/>
  </g>

  <!-- montañas -->
  <polygon points="0,440 170,250 300,380 430,230 640,450" fill="#4a9fb0"/>
  <polygon points="430,230 400,275 430,265 455,285 475,262" fill="#ffffff" opacity="0.9"/>
  <polygon points="170,250 145,285 170,277 192,293" fill="#ffffff" opacity="0.9"/>
  <polygon points="560,450 800,270 940,380 1070,300 1200,420 1200,470" fill="#3d8f9b"/>
  <polygon points="800,270 775,303 800,296 822,312" fill="#ffffff" opacity="0.9"/>

  <!-- lluvia -->
  <g stroke="#7cc8e6" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="210" y1="190" x2="200" y2="215"/><line x1="240" y1="200" x2="230" y2="225"/>
    <line x1="270" y1="185" x2="260" y2="210"/><line x1="300" y1="205" x2="290" y2="230"/>
    <line x1="330" y1="190" x2="320" y2="215"/>
  </g>

  <!-- colinas -->
  <path d="M0 450 C 200 390, 400 440, 600 415 S 1000 380, 1200 435 L1200 670 L0 670 Z" fill="#58b872"/>
  <path d="M0 520 C 250 470, 450 540, 700 500 S 1050 470, 1200 520 L1200 670 L0 670 Z" fill="#3fa05f"/>

  <!-- río -->
  <path d="M610 405 C 560 460, 700 480, 625 540 S 545 615, 600 680" fill="none" stroke="#2aa8d6" stroke-width="58" stroke-linecap="round"/>
  <path d="M610 405 C 560 460, 700 480, 625 540 S 545 615, 600 680" fill="none" stroke="#9fe3f5" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- casa izquierda -->
  <rect x="120" y="400" width="130" height="85" fill="#f4efe6"/>
  <polygon points="108,402 185,345 262,402" fill="#c8553d"/>
  <rect x="170" y="430" width="32" height="55" fill="#2f7fa0"/>
  <rect x="128" y="418" width="28" height="26" fill="#bfe9f7"/>

  <!-- grifo y agua potable -->
  <g transform="translate(330,500)">
    <rect x="-8" y="-60" width="16" height="70" rx="4" fill="#5b6f82"/>
    <rect x="-8" y="-62" width="42" height="12" rx="5" fill="#5b6f82"/>
    <path d="M30 -48 q 0 22 -5 40" stroke="#4fc3ef" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="25" cy="14" rx="26" ry="6" fill="#4fc3ef" opacity="0.7"/>
  </g>

  <!-- personas -->
  <g transform="translate(395,470)" color="#f2a03d"><use href="#person"/></g>
  <g transform="translate(430,486) scale(0.7)" color="#e05d6f"><use href="#person"/></g>
  <g transform="translate(265,505) scale(0.85)" color="#2fa0a8"><use href="#person"/></g>

  <!-- árboles -->
  <use href="#tree" x="60" y="470"/>
  <use href="#tree" x="470" y="455"/>
  <use href="#tree" x="780" y="465"/>
  <use href="#tree" x="1130" y="450"/>
  <use href="#tree" x="120" y="590"/>
  <use href="#tree" x="1060" y="590"/>

  <!-- planta de tratamiento -->
  <g transform="translate(860,330)">
    <rect x="0" y="40" width="70" height="110" rx="8" fill="#e8f1f5" stroke="#7fa6b8" stroke-width="3"/>
    <rect x="0" y="95" width="70" height="55" rx="4" fill="#4fc3ef" opacity="0.8"/>
    <rect x="95" y="0" width="90" height="150" rx="14" fill="#e8f1f5" stroke="#7fa6b8" stroke-width="3"/>
    <rect x="95" y="70" width="90" height="80" rx="6" fill="#4fc3ef" opacity="0.8"/>
    <path d="M140 20 q 12 18 0 28 q -12 -10 0 -28z" fill="#1380b8"/>
    <rect x="205" y="60" width="95" height="90" rx="14" fill="#e8f1f5" stroke="#7fa6b8" stroke-width="3"/>
    <rect x="205" y="100" width="95" height="50" rx="6" fill="#4fc3ef" opacity="0.8"/>
    <rect x="70" y="120" width="25" height="10" fill="#7fa6b8"/>
    <rect x="185" y="120" width="20" height="10" fill="#7fa6b8"/>
    <rect x="-30" y="140" width="360" height="10" rx="5" fill="#7fa6b8"/>
  </g>

  <!-- baños / saneamiento -->
  <g transform="translate(960,490)">
    <rect x="0" y="0" width="190" height="85" rx="4" fill="#e8f1f5"/>
    <rect x="0" y="-10" width="190" height="14" fill="#1b9bb8"/>
    <rect x="22" y="18" width="34" height="67" fill="#1b9bb8"/>
    <rect x="70" y="18" width="34" height="67" fill="#1b9bb8"/>
    <rect x="118" y="18" width="34" height="67" fill="#1b9bb8"/>
    <circle cx="39" cy="32" r="4" fill="#fff"/><rect x="36" y="38" width="6" height="14" fill="#fff"/>
    <circle cx="87" cy="32" r="4" fill="#fff"/><rect x="84" y="38" width="6" height="14" fill="#fff"/>
    <circle cx="135" cy="32" r="4" fill="#fff"/><rect x="132" y="38" width="6" height="14" fill="#fff"/>
  </g>

  <!-- gota grande ODS 6 -->
  <g>
    <circle cx="600" cy="250" r="125" fill="#ffffff" opacity="0.55"/>
    <path d="M600 110 C 560 170, 520 210, 520 255 A 80 80 0 0 0 680 255 C 680 210, 640 170, 600 110 Z" fill="url(#drop)" stroke="#ffffff" stroke-width="6"/>
    <ellipse cx="567" cy="245" rx="12" ry="26" fill="#ffffff" opacity="0.35" transform="rotate(12 567 245)"/>
    <text x="600" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="88" fill="#ffffff">6</text>
  </g>

  <!-- gotas flotando -->
  <g fill="#4fc3ef">
    <path d="M440 330 q 14 22 0 34 q -14 -12 0 -34z"/>
    <path d="M770 340 q 12 20 0 30 q -12 -10 0 -30z"/>
    <path d="M700 120 q 10 16 0 25 q -10 -9 0 -25z"/>
    <path d="M490 140 q 10 16 0 25 q -10 -9 0 -25z"/>
  </g>

  <!-- título -->
  <rect x="290" y="588" width="620" height="62" rx="31" fill="#0b4f6c" opacity="0.9"/>
  <text x="600" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#ffffff">ODS 6 · Agua limpia y saneamiento</text>
</svg>
