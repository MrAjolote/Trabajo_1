<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 424" width="556" height="424" role="img" aria-label="Gota con símbolo de oferta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8fd"/>
      <stop offset="1" stop-color="#bfe6f7"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6f7"/>
      <stop offset="1" stop-color="#1380b8"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a21a"/>
    </radialGradient>
    <g id="spark"><path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="#ffffff"/></g>
  </defs>

  <rect width="556" height="424" rx="24" fill="url(#bg)"/>
  <circle cx="278" cy="230" r="170" fill="#ffffff" opacity="0.45"/>

  <!-- gota -->
  <path d="M278 40 C 230 120, 160 190, 160 270 A 118 118 0 0 0 396 270 C 396 190, 326 120, 278 40 Z" fill="url(#drop)" stroke="#ffffff" stroke-width="7"/>
  <ellipse cx="222" cy="262" rx="14" ry="42" fill="#ffffff" opacity="0.35" transform="rotate(12 222 262)"/>
  <text x="278" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" fill="#ffffff">%</text>

  <!-- etiqueta OFERTA -->
  <g transform="translate(418,92) rotate(14)">
    <rect x="-62" y="-26" width="124" height="52" rx="12" fill="#e02424"/>
    <circle cx="-44" cy="0" r="6" fill="#ffffff"/>
    <text x="10" y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#ffffff">OFERTA</text>
  </g>

  <!-- monedas -->
  <g transform="translate(92,350)">
    <ellipse cx="0" cy="22" rx="46" ry="12" fill="#b9871a" opacity="0.35"/>
    <circle cx="0" cy="0" r="40" fill="url(#coin)" stroke="#c18a12" stroke-width="5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#c18a12" stroke-width="2" opacity="0.7"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="#9a6a08">S/</text>
  </g>
  <g transform="translate(150,385)">
    <circle cx="0" cy="0" r="24" fill="url(#coin)" stroke="#c18a12" stroke-width="4"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#9a6a08">S/</text>
  </g>

  <!-- brillos -->
  <use href="#spark" x="120" y="110"/>
  <use href="#spark" x="470" y="250" transform="translate(0,0) scale(1)"/>
  <use href="#spark" x="75" y="230"/>
  <use href="#spark" x="500" y="360"/>
</svg>
